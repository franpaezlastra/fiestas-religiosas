# Deploy → DonWeb public_html
#
# Push a main → build Vite → FTP a public_html
#
# Secretos (Settings → Secrets and variables → Actions):
#   FTP_SERVER       ej. ftp.tudominio.com
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_SERVER_DIR   ej. /public_html/   (barra final)
#   VITE_API_URL     ej. https://fiestas-religiosas-preview.vercel.app/api/v1
#   VITE_CLOUDINARY_CLOUD_NAME  (opcional)

name: Deploy DonWeb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Falta el secreto VITE_API_URL" >&2
            exit 1
          fi
          export VITE_CLOUDINARY_CLOUD_NAME="${VITE_CLOUDINARY_CLOUD_NAME:-duuwqmpmn}"
          npm run build

      - name: Ensure .htaccess in dist
        run: |
          if [ ! -f dist/.htaccess ] && [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      - name: FTP upload to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
