# Deploy → DonWeb public_html
#
# Push a main → build Vite → sube dist/ por FTPS (lftp)
#
# Secretos (Settings → Secrets and variables → Actions):
#   FTP_SERVER       ej. c2662154.ferozo.com
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_SERVER_DIR   ej. /public_html/   (barra final)
#   VITE_API_URL     ej. https://fiestas-religiosas-preview.vercel.app/api/v1
#   VITE_CLOUDINARY_CLOUD_NAME  (opcional)

name: Deploy DonWeb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Falta el secreto VITE_API_URL" >&2
            exit 1
          fi
          export VITE_CLOUDINARY_CLOUD_NAME="${VITE_CLOUDINARY_CLOUD_NAME:-duuwqmpmn}"
          npm run build

      - name: Ensure .htaccess in dist
        run: |
          if [ ! -f dist/.htaccess ] && [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      # DonWeb exige SSL/TLS en el canal de control; SamKirkland FTP-Deploy
      # falla con 550. lftp con ftp:ssl-force funciona en Ferozo.
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload dist via FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "Faltan secretos FTP_SERVER / FTP_USERNAME / FTP_PASSWORD" >&2
            exit 1
          fi
          TARGET="${FTP_SERVER_DIR:-/public_html/}"
          # Normalizar barra final
          case "$TARGET" in
            */) ;;
            *) TARGET="${TARGET}/" ;;
          esac

          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 20;
            open -u '${FTP_USERNAME}','${FTP_PASSWORD}' ftp://${FTP_SERVER};
            mirror -R --verbose --parallel=2 \
              --exclude-glob .git* \
              --exclude-glob stats.html \
              ./dist/ ${TARGET};
            bye
          "
