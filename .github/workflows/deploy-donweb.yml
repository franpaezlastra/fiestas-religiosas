# Deploy → DonWeb public_html
#
# Secretos:
#   FTP_SERVER       c2662154.ferozo.com
#   FTP_USERNAME     ftp@c2662154.ferozo.com   ← preferí este (Ferozo)
#   FTP_PASSWORD     la del panel FTP (sin espacios)
#   FTP_SERVER_DIR   /public_html/
#   VITE_API_URL
#   VITE_CLOUDINARY_CLOUD_NAME  (opcional)

name: Deploy DonWeb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Falta el secreto VITE_API_URL" >&2
            exit 1
          fi
          export VITE_CLOUDINARY_CLOUD_NAME="${VITE_CLOUDINARY_CLOUD_NAME:-duuwqmpmn}"
          npm run build

      - name: Ensure .htaccess in dist
        run: |
          if [ ! -f dist/.htaccess ] && [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload dist via FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          # Trim espacios accidentales en secretos
          FTP_SERVER="$(printf '%s' "$FTP_SERVER" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_USERNAME="$(printf '%s' "$FTP_USERNAME" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FTP_PASSWORD="$(printf '%s' "$FTP_PASSWORD" | tr -d '\r')"
          FTP_SERVER_DIR="$(printf '%s' "${FTP_SERVER_DIR:-/public_html/}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Faltan secretos FTP" >&2
            exit 1
          fi

          TARGET="$FTP_SERVER_DIR"
          case "$TARGET" in
            */) ;;
            *) TARGET="${TARGET}/" ;;
          esac

          echo "FTP host=$FTP_SERVER user=$FTP_USERNAME dir=$TARGET pass_len=${#FTP_PASSWORD}"

          # .netrc: la pass con @ no se rompe al parsear
          cat > "$HOME/.netrc" <<EOF
          machine ${FTP_SERVER}
          login ${FTP_USERNAME}
          password ${FTP_PASSWORD}
          EOF
          chmod 600 "$HOME/.netrc"

          lftp -e "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 25;
            open ftp://${FTP_SERVER};
            mirror -R --verbose --parallel=2 --exclude-glob .git* --exclude-glob stats.html ./dist/ ${TARGET};
            bye
          "

          rm -f "$HOME/.netrc"
