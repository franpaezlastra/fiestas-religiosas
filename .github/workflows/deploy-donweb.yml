# Deploy → DonWeb public_html
#
# Secretos:
#   FTP_SERVER       c2662154.ferozo.com
#   FTP_USERNAME     ftp@c2662154.ferozo.com  (o c2662154)
#   FTP_PASSWORD
#   FTP_SERVER_DIR   /public_html/
#   VITE_API_URL
#   VITE_CLOUDINARY_CLOUD_NAME  (opcional)

name: Deploy DonWeb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Falta el secreto VITE_API_URL" >&2
            exit 1
          fi
          export VITE_CLOUDINARY_CLOUD_NAME="${VITE_CLOUDINARY_CLOUD_NAME:-duuwqmpmn}"
          npm run build

      - name: Ensure .htaccess in dist
        run: |
          if [ ! -f dist/.htaccess ] && [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      # DonWeb exige AUTH TLS antes de USER/PASS. ftplib.FTP_TLS lo hace bien.
      - name: Upload dist via FTPS (Python)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 <<'PY'
          import os, ssl, sys
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path

          host = os.environ["FTP_SERVER"].strip()
          user = os.environ["FTP_USERNAME"].strip()
          password = os.environ["FTP_PASSWORD"]  # no strip medio: solo bordes
          password = password.strip("\r\n")
          remote_root = (os.environ.get("FTP_SERVER_DIR") or "/public_html/").strip()
          if not remote_root.endswith("/"):
              remote_root += "/"
          local_root = Path("dist")

          print(f"FTP host={host} user={user} dir={remote_root} pass_len={len(password)}")

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          ftp = FTP_TLS(context=ctx, timeout=60)
          ftp.connect(host, 21)
          ftp.auth()          # AUTH TLS en canal de control ANTES del login
          ftp.login(user, password)
          ftp.prot_p()        # datos también cifrados
          ftp.set_pasv(True)
          print("Login OK:", ftp.getwelcome())

          def ensure_dir(path: str):
              parts = [p for p in path.strip("/").split("/") if p]
              cur = ""
              for part in parts:
                  cur += "/" + part
                  try:
                      ftp.mkd(cur)
                  except error_perm:
                      pass

          ensure_dir(remote_root.rstrip("/"))

          uploaded = 0
          for path in local_root.rglob("*"):
              if not path.is_file():
                  continue
              if path.name == "stats.html":
                  continue
              rel = path.relative_to(local_root).as_posix()
              remote = remote_root + rel
              parent_dir = remote.rsplit("/", 1)[0]
              ensure_dir(remote_dir)
              with path.open("rb") as fh:
                  ftp.storbinary(f"STOR {remote}", fh)
              uploaded += 1
              if uploaded % 25 == 0:
                  print(f"… {uploaded} archivos")

          ftp.quit()
          print(f"Listo: {uploaded} archivos → {remote_root}")
          PY
