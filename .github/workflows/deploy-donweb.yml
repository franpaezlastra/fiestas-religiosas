# Deploy → DonWeb public_html
#
# Secretos:
#   FTP_SERVER       c2662154.ferozo.com
#   FTP_USERNAME     c2662154  (también prueba ftp@c2662154.ferozo.com)
#   FTP_PASSWORD     la de Ferozo / FTP
#   FTP_SERVER_DIR   /public_html/
#   VITE_API_URL     https://api-preview.fiestasreligiosas.com/api/v1
#   VITE_CLOUDINARY_CLOUD_NAME  (opcional)

name: Deploy DonWeb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-donweb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Falta el secreto VITE_API_URL" >&2
            exit 1
          fi
          export VITE_CLOUDINARY_CLOUD_NAME="${VITE_CLOUDINARY_CLOUD_NAME:-duuwqmpmn}"
          npm run build

      - name: Ensure .htaccess in dist
        run: |
          if [ ! -f dist/.htaccess ] && [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      - name: Upload dist via FTPS (Python)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 <<'PY'
          import os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path

          host = os.environ["FTP_SERVER"].strip().removeprefix("ftp://").removeprefix("ftps://").split("/")[0]
          primary = os.environ["FTP_USERNAME"].strip()
          password = os.environ["FTP_PASSWORD"].strip("\r\n")
          remote_root = (os.environ.get("FTP_SERVER_DIR") or "/public_html/").strip()
          if not remote_root.endswith("/"):
              remote_root += "/"
          local_root = Path("dist")

          # Probar usuario del secreto + variantes típicas Ferozo
          candidates = []
          for u in (
              primary,
              f"ftp@{host}" if "@" not in primary else primary.split("@")[0],
              primary.split("@")[0] if "@" in primary else f"ftp@{host}",
          ):
              if u and u not in candidates:
                  candidates.append(u)

          print(f"FTP host={host} dir={remote_root} pass_len={len(password)}")
          print("Usuarios a probar:", ", ".join(candidates))

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          ftp = None
          last_err = None
          for user in candidates:
              for port in (21, 990):
                  try:
                      print(f"… intento user={user} port={port}")
                      client = FTP_TLS(context=ctx, timeout=45)
                      client.connect(host, port)
                      # En 990 el TLS ya es implícito; auth() puede fallar → ignorar
                      try:
                          client.auth()
                      except Exception as auth_err:
                          if port == 21:
                              raise
                          print(f"  auth() omitido en {port}: {auth_err}")
                      client.login(user, password)
                      try:
                          client.prot_p()
                      except Exception:
                          pass
                      client.set_pasv(True)
                      ftp = client
                      print(f"Login OK con user={user} port={port} pwd={client.pwd()}")
                      break
                  except Exception as e:
                      last_err = e
                      print(f"  FAIL: {e}")
                      try:
                          client.close()
                      except Exception:
                          pass
              if ftp is not None:
                  break

          if ftp is None:
              raise SystemExit(f"No se pudo login FTP. Último error: {last_err}")

          def ensure_dir(path: str):
              parts = [p for p in path.strip("/").split("/") if p]
              cur = ""
              for part in parts:
                  cur += "/" + part
                  try:
                      ftp.mkd(cur)
                  except error_perm:
                      pass

          ensure_dir(remote_root.rstrip("/"))

          uploaded = 0
          for path in local_root.rglob("*"):
              if not path.is_file() or path.name == "stats.html":
                  continue
              rel = path.relative_to(local_root).as_posix()
              remote = remote_root + rel
              ensure_dir(remote.rsplit("/", 1)[0])
              with path.open("rb") as fh:
                  ftp.storbinary(f"STOR {remote}", fh)
              uploaded += 1
              if uploaded % 25 == 0:
                  print(f"… {uploaded} archivos")

          ftp.quit()
          print(f"Listo: {uploaded} archivos → {remote_root}")
          PY
